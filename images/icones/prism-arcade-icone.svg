<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Prism Arcade">
  <defs>
    <linearGradient id="pa-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#c7d2fe" stop-opacity=".85"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="pa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#0a0a18"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#pa-bg)"/>
  <!-- faisceau blanc entrant -->
  <path d="M4 32 H20" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
  <!-- éventail spectral sortant -->
  <g stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M40 30 L60 14" stroke="#a855f7"/>
    <path d="M41 31 L60 22" stroke="#22d3ee"/>
    <path d="M42 32 L60 31" stroke="#34d399"/>
    <path d="M41 33 L60 40" stroke="#facc15"/>
    <path d="M40 34 L60 49" stroke="#f43f5e"/>
  </g>
  <!-- le prisme = bouton « play » -->
  <path d="M20 15 L46 32 L20 49 Z" fill="url(#pa-glass)" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M24 22 L24 31" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/>
</svg>
